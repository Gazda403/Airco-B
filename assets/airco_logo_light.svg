<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" width="340" height="76" fill="none">
  <!-- Circular Qi Symbol Badge -->
  <g transform="translate(4, 4)">
    <circle cx="34" cy="34" r="32" stroke="#38bdf8" stroke-width="2.5" fill="rgba(56, 189, 248, 0.12)" />
    <circle cx="34" cy="34" r="27.5" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
    <!-- Chinese character 氣 (Qi = Air, Breath, Atmosphere) -->
    <text x="34" y="44" font-family="'Noto Serif SC', 'Songti SC', 'Source Han Serif', 'Georgia', serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">氣</text>
  </g>
  
  <!-- AIRCO B Typography -->
  <g transform="translate(82, 10)">
    <text x="0" y="32" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="31" font-weight="800" letter-spacing="0.5" fill="#ffffff">
      AIRCO <tspan fill="#38bdf8">B</tspan>
    </text>
    
    <!-- Thin Sleek Engineering Line -->
    <line x1="0" y1="40" x2="242" y2="40" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Tagline: Sistemi ventilacije i klimatizacije -->
    <text x="0" y="54" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.2" text-transform="uppercase" fill="#94a3b8">
      SISTEMI VENTILACIJE I KLIMATIZACIJE
    </text>
  </g>
</svg>

